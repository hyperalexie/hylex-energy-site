<form id="inq" class="inq" novalidate enctype="multipart/form-data"><input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px">
<div class="fg"><label>Name*<input name="name" required></label><label>Company<input name="company"></label><label>Email*<input type="email" name="email" required></label><label>Phone<input name="phone"></label>
<label class="full">What do you need?*<textarea name="message" rows="5" required placeholder="Scope, material or spec, quantity, delivery location"></textarea></label>
<label>Offer needed by<input name="deadline" placeholder="e.g. 30 Oct"></label><label>Files link<input name="link" placeholder="Dropbox, Drive or WeTransfer link"></label>
<label class="full">Attachment (max 4 MB)<input type="file" name="file"></label></div>
<input type="hidden" name="type" value="Enquiry"><input type="hidden" name="lang" value="en">
<button class="btn p" type="submit">Send enquiry</button><p id="inqmsg" class="inqmsg" aria-live="polite"></p></form></div></section>
<style>.inq .fg{display:grid;grid-template-columns:1fr;gap:14px;max-width:820px;margin-bottom:18px}@media(min-width:700px){.inq .fg{grid-template-columns:1fr 1fr}}
.inq label{display:flex;flex-direction:column;font-size:14px;font-weight:600;color:var(--mute);gap:6px}.inq .full{grid-column:1/-1}
.inq label{min-width:0}.inq input,.inq textarea{width:100%;box-sizing:border-box;min-width:0;font:inherit;font-size:16px;border:1px solid #cfd3d6;border-radius:4px;padding:11px 12px;color:var(--ink)}.inqmsg{margin-top:12px;font-weight:600}</style>
<script>(function(){var f=document.getElementById('inq'),m=document.getElementById('inqmsg');f.addEventListener('submit',async function(e){e.preventDefault();
if(!f.name.value.trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.value)||!f.message.value.trim()){m.textContent='Please give your name, a valid email and a short description.';return}
m.textContent='Sending...';try{var r=await fetch('/api/inquiry',{method:'POST',body:new FormData(f)});var j=await r.json();
if(j.ok){m.textContent=j.partial?j.error:'Thank you. We reply within one working day.';f.reset()}else m.textContent=j.error||'Could not send. Please email amac@hylexenergy.com.'}catch(x){m.textContent='Could not send. Please email amac@hylexenergy.com.'}})})();</script>
